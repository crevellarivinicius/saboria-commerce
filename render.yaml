services:
  - type: web
    name: saboria-backend
    runtime: node
    plan: free
    region: virginia
    rootDir: apps/backend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Admin desligado no free tier (512MB): economiza build e runtime.
      # Para administrar, rode o admin localmente apontando para o mesmo DATABASE_URL.
      - key: DISABLE_MEDUSA_ADMIN
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      # Preencher no dashboard do Render:
      - key: DATABASE_URL # connection string do Supabase (Session pooler, porta 5432)
        sync: false
      - key: REDIS_URL # rediss:// do Upstash
        sync: false
      - key: STORE_CORS # URL do storefront no Cloudflare (ex.: https://saboria-commerce-storefront.SEU-SUBDOMINIO.workers.dev)
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
