name: Keep demo backend awake

# Render's free tier sleeps after 15 minutes without traffic; a cold start
# takes ~50s. Pinging /health every 10 minutes keeps the live demo responsive.
# One always-on free instance fits within Render's 750 free hours per month.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl --fail --silent --show-error --max-time 120 https://saboria-backend.onrender.com/health
