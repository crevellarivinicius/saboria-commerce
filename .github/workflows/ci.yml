name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-build:
    name: Backend build (Medusa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build backend
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:9000
          JWT_SECRET: ci
          COOKIE_SECRET: ci
        run: npm run build -w @crevellari/backend

  storefront-typecheck:
    name: Storefront typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/storefront
        run: npx tsc --noEmit
